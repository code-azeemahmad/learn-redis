# Listen on all interfaces inside the container.
bind 0.0.0.0

# Run in the foreground for Docker.
daemonize no

# Do not enable protected mode because this service
# will be isolated inside a private Docker network.
protected-mode no

# Memory management.
maxmemory 256mb
maxmemory-policy allkeys-lru

# Logging.
loglevel notice

# Disable RDB snapshots.
save ""

# Disable AOF persistence.
appendonly no