# ==============================================================================
# Redis Production Configuration - Cache-Only Instance
# ==============================================================================
aclfile /usr/local/etc/redis/users.acl
# ------------------------------------------------------------------------------
# 1. Network & Daemon Configuration
# ------------------------------------------------------------------------------
# Bind to all container network interfaces
bind 0.0.0.0

# Standard Redis port inside container (NOT exposed to the host)
port 6379

# Run in foreground for Docker container lifecycle management
daemonize no

# Protected mode enabled for security
protected-mode yes

# TCP listen backlog for high throughput
tcp-backlog 511

# Close connection if client is idle (0 = disabled / keep alive)
timeout 0

# Detect dead peers every 300 seconds
tcp-keepalive 300

# Logging level
loglevel notice

# ------------------------------------------------------------------------------
# 2. Memory Management & Eviction (Cache Settings)
# ------------------------------------------------------------------------------
# Hard memory limit (configured with headroom below container 384m mem_limit)
maxmemory 256mb

# Eviction policy: Remove least recently used (LRU) keys when memory is full
maxmemory-policy allkeys-lru

# LRU sample size (default 5 provides good speed/accuracy balance)
maxmemory-samples 5

# Asynchronous non-blocking memory reclamation
lazyfree-lazy-eviction yes
lazyfree-lazy-expire yes
lazyfree-lazy-server-del yes

# ------------------------------------------------------------------------------
# 3. Cache-Only Persistence Settings (Pure In-Memory Cache)
# ------------------------------------------------------------------------------
# Disable RDB snapshotting (an empty string disables all save rules)
save ""

# Disable Append Only File (AOF) persistence
appendonly no
