services:
  redis:
    image: redis:8-alpine
    container_name: redis-cache
    restart: unless-stopped

    command:
      - redis-server
      - /usr/local/etc/redis/redis.conf

    volumes:
      - ./redis/redis.conf:/usr/local/etc/redis/redis.conf:ro
      - ./redis/users.acl:/usr/local/etc/redis/users.acl:ro

    environment:
      HEALTHCHECK_REDIS_PASSWORD: ${HEALTHCHECK_REDIS_PASSWORD:?Set health-check password}

    networks:
      - app-network

    mem_limit: 384m

    healthcheck:
      test:
        - CMD-SHELL
        - 'redis-cli --user healthcheck --pass "$$HEALTHCHECK_REDIS_PASSWORD" ping | grep -q PONG'
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s

networks:
  app-network:
    driver: bridge