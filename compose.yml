
services:
  redis:
    image: redis:8-alpine
    container_name: redis-cache
    restart: unless-stopped

    command: ["redis-server", "/usr/local/etc/redis/redis.conf"]

    volumes:
      - ./redis/redis.conf:/usr/local/etc/redis/redis.conf:ro

    networks:
      - app-network

    ports:
      - "127.0.0.1:6379:6379"

    mem_limit: 384m

    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s

networks:
  app-network:
    driver: bridge
